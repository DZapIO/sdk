name: Test

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

# Default-deny: each job requests only what it needs.
permissions: {}

jobs:
  verify:
    name: Lint, types, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions are pinned by commit SHA, not tag: a tag can be moved to point
      # at different code after it was reviewed.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No `version:` here on purpose — action-setup reads the `packageManager`
      # field in package.json, so the CI and local pnpm versions cannot drift.
      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile fails the build if package.json and pnpm-lock.yaml
      # have drifted apart, rather than silently resolving something new.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check:types

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

  # The integration suite hits the live DZap API, public RPCs and Sui mainnet.
  # Third-party availability must never gate a merge, so this is advisory only:
  # a gate that goes red because someone else's RPC is down gets ignored within
  # a week, and then it gates nothing at all.
  integration:
    name: Integration tests (advisory)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration
